# Render blueprint — provisions the ZELO backend + its PostgreSQL DB.
#
# How to apply:
#   1. Push this file to `develop`.
#   2. In the Render dashboard, choose New → Blueprint → connect this repo.
#   3. Set the secret env vars in the Render dashboard:
#        - JWT_ACCESS_SECRET
#        - JWT_REFRESH_SECRET
#        - CORS_ORIGINS (e.g. your Vercel preview/production URLs)
#   4. Copy the service's deploy hook URL into the GitHub secret
#      `RENDER_DEPLOY_HOOK_URL` so the GitHub Actions workflow can trigger
#      redeploys on every push to `develop`.

services:
  - type: web
    name: zelo-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: develop
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: zelo-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
      - key: BCRYPT_SALT_ROUNDS
        value: 12

databases:
  - name: zelo-postgres
    plan: free
    region: oregon
    databaseName: zelo_marketplace
    user: zelo
