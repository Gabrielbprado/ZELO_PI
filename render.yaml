# Render blueprint — provisions the ZELO backend + its PostgreSQL DB.
#
# How to apply:
#   1. Push this file to `develop`.
#   2. In the Render dashboard, choose New → Blueprint → connect this repo.
#   3. Set the secret env vars in the Render dashboard:
#        - JWT_ACCESS_SECRET
#        - JWT_REFRESH_SECRET
#        - CORS_ORIGINS (e.g. your Vercel preview/production URLs)
#   4. Copy the service's deploy hook URL into the GitHub secret
#      `RENDER_DEPLOY_HOOK_URL` so the GitHub Actions workflow can trigger
#      redeploys on every push to `develop`.

services:
  - type: web
    name: zelo-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: develop
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: zelo-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      # Recomendação personalizada. Se `zelo-ml` estiver hibernando (free tier
      # dorme após ~15 min), o backend degrada para ordenação por avaliação —
      # por isso o timeout é generoso mas não infinito.
      - key: ML_ENABLED
        value: true
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TOKEN
        fromService:
          type: web
          name: zelo-ml
          envVarKey: ML_SERVICE_TOKEN
      - key: ML_TIMEOUT_MS
        value: 1500
      # Redis. O Render não oferece Redis gerenciado no plano free, então a URL
      # aponta para um provedor externo com free tier (Upstash) e é preenchida no
      # dashboard. Se ficar vazia, basta REDIS_ENABLED=false: a API sobe sem cache,
      # com rate limit por instância — degradação prevista, não falha.
      - key: REDIS_ENABLED
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: zelo-prod
      # RabbitMQ. Mesma história do Redis: não há plano gerenciado free no Render.
      # A URL aponta para um provedor externo com free tier (CloudAMQP) e é
      # preenchida no dashboard. Com RABBITMQ_ENABLED=false a API sobe normalmente: o
      # outbox continua sendo gravado dentro das transações, os eventos só ficam
      # represados até um broker existir — degradação prevista, não falha.
      - key: RABBITMQ_ENABLED
        sync: false
      - key: RABBITMQ_URL
        sync: false

  - type: web
    name: zelo-ml
    runtime: python
    plan: free
    region: oregon
    rootDir: ml
    branch: develop
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # `--workers 1` não é economia: numpy+scipy+sklearn residentes já ocupam
    # ~200 MB dos 512 MB do plano free. Um segundo worker estouraria.
    startCommand: uvicorn zelo_ml.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # No Render o filesystem é efêmero: o artefato mora no Postgres, senão
      # não sobreviveria a um redeploy nem seria visível ao web service.
      - key: ML_ARTIFACT_BACKEND
        value: db
      - key: ML_DATABASE_URL
        fromDatabase:
          name: zelo-postgres
          property: connectionString
      - key: ML_SERVICE_TOKEN
        generateValue: true
      - key: ML_MODEL_POLL_SECONDS
        value: 300

databases:
  - name: zelo-postgres
    plan: free
    region: oregon
    databaseName: zelo_marketplace
    user: zelo
