# SonarCloud project descriptor.
# Replace `sonar.organization` if you import the repo under a different
# SonarCloud organisation than your GitHub username.

sonar.organization=gabrielbprado
sonar.projectKey=Gabrielbprado_ZELO_PI
sonar.projectName=ZELO Marketplace
sonar.projectVersion=1.0

# Source layout — analyse both packages from the repo root.
sonar.sources=backend/src,mobile/src,ml/src
sonar.tests=backend/tests,ml/tests

# Exclude generated and vendored artefacts.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  backend/prisma/migrations/**,\
  mobile/.expo/**,\
  ml/artifacts/**,\
  ml/reports/**,\
  ml/.venv/**

sonar.test.exclusions=\
  **/node_modules/**

sonar.sourceEncoding=UTF-8
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Coverage reports — wire these in once `npm test -- --coverage` is enabled.
# sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,mobile/coverage/lcov.info

sonar.python.version=3.12
