name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  # A suíte de integração é a mais valiosa do projeto — cobre RBAC, rotação de
  # refresh token, PostGIS e o caminho degradado do serviço de ML — e não rodava
  # aqui por falta de um Postgres. O resultado foi previsível: sete testes
  # quebrados passaram despercebidos, entre eles a detecção de reuso de refresh
  # token, que estava invertida. Um job separado do unitário para que uma falha
  # de infraestrutura não seja confundida com falha de lógica.
  backend-integration:
    name: Backend — testes de integração
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Mesma imagem do docker-compose: o casamento por proximidade e a âncora
        # do recomendador exigem PostGIS, e o Postgres puro faria as migrations
        # falharem em `CREATE EXTENSION postgis`.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zero_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Com o Redis presente, a suíte exercita o caminho COM cache — inclusive a
      # invalidação. Sem ele, os testes específicos de Redis são pulados e o resto
      # roda no caminho degradado. Rodar aqui com Redis garante que o caminho mais
      # complexo dos dois é o que o CI verifica.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Com o RabbitMQ presente, a suíte exercita o CICLO COMPLETO do barramento:
      # outbox → relay → consumidor persiste a notificação. Sem ele, esses testes se
      # pulam e só o outbox transacional (que não precisa de broker) é verificado.
      # É o caminho mais complexo — logo, o que o CI deve cobrir.
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zero_marketplace_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zero_marketplace_test?schema=public
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: zelo-ci
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://guest:guest@localhost:5672

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm run test:integration

  notifications-service:
    name: Notifications — lint + testes (com broker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zero_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      # Schema-per-service: mesmo Postgres, schema `notifications`. A migration cria o
      # schema (CREATE SCHEMA IF NOT EXISTS) e as tabelas isoladas do `public`.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zero_marketplace_test?schema=notifications
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zero_marketplace_test?schema=notifications
      SERVICE_TOKEN: ci_service_token_16_chars_ok
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      # Liga o ciclo completo com broker real (consumer.test.ts).
      BROKER_TESTS: '1'
      PUSH_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/notifications/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run lint

      - name: Apply migrations (schema notifications)
        run: npx prisma migrate deploy

      - name: Tests (mapper + API + ciclo com broker)
        run: npm test

  ml:
    name: ML — lint + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy src

      - name: Tests
        run: pytest -q --cov=zelo_ml --cov-fail-under=80

      # O contrato entre Node e Python é escrito à mão dos dois lados — o modo
      # de falha clássico é os dois divergirem em silêncio. Aqui o JSON Schema é
      # regenerado a partir do pydantic e qualquer diferença quebra o build.
      - name: Contrato em dia
        run: |
          python -m zelo_ml.api.schemas > contracts/rank.schema.json
          git diff --exit-code contracts/

  mobile:
    name: Mobile — typecheck, cores e contraste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # O app estiliza 100% inline; sem estes dois passos, nada impede uma cor literal
      # (ou um par ilegível) de entrar — o typecheck não tem opinião sobre cor.
      - name: Cores fora do tema
        run: npm run check:colors

      - name: Contraste WCAG da paleta
        run: npm run check:contrast
