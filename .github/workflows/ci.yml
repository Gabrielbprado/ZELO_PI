name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  ml:
    name: ML — lint + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy src

      - name: Tests
        run: pytest -q --cov=zelo_ml --cov-fail-under=80

      # O contrato entre Node e Python é escrito à mão dos dois lados — o modo
      # de falha clássico é os dois divergirem em silêncio. Aqui o JSON Schema é
      # regenerado a partir do pydantic e qualquer diferença quebra o build.
      - name: Contrato em dia
        run: |
          python -m zelo_ml.api.schemas > contracts/rank.schema.json
          git diff --exit-code contracts/

  mobile:
    name: Mobile — typecheck, cores e contraste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # O app estiliza 100% inline; sem estes dois passos, nada impede uma cor literal
      # (ou um par ilegível) de entrar — o typecheck não tem opinião sobre cor.
      - name: Cores fora do tema
        run: npm run check:colors

      - name: Contraste WCAG da paleta
        run: npm run check:contrast
