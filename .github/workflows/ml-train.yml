name: ML — retreino semanal

# Segundas, 06:00 UTC (03:00 em Brasília). Semanal é a cadência honesta para o
# volume atual; com telemetria real de `RecEvent` acumulando, migrar para diário.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      activate:
        description: 'Ativar o modelo se o gate de avaliação passar'
        type: boolean
        default: true

concurrency:
  group: ml-train
  cancel-in-progress: false

jobs:
  train:
    name: Treinar e avaliar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      # `--fail-under` faz o job falhar quando o modelo novo não supera a
      # ordenação atual do app. O artefato ainda é gravado (para inspeção), mas
      # NÃO é ativado — um modelo pior nunca chega ao usuário em silêncio.
      - name: Treinar, avaliar e aplicar o gate
        env:
          ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
          ML_ARTIFACT_BACKEND: db
        run: |
          python -m zelo_ml.training.train \
            --backend db \
            ${{ inputs.activate != false && '--activate' || '' }} \
            --fail-under

      - name: Publicar relatório no resumo do job
        if: always()
        run: cat reports/eval-*.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: ml/reports/
          retention-days: 90

      # Só recarrega o serviço se tudo acima passou: o `if: success()` é o que
      # impede um modelo reprovado de entrar em produção por um passo solto.
      - name: Recarregar o modelo no serviço
        if: success() && env.ML_SERVICE_URL != ''
        env:
          ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL }}
          ML_SERVICE_TOKEN: ${{ secrets.ML_SERVICE_TOKEN }}
        run: |
          curl -fsS -X POST "$ML_SERVICE_URL/v1/model/reload" \
            -H "X-ML-Token: $ML_SERVICE_TOKEN"
