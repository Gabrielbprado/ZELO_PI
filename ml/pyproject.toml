[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zelo-ml"
version = "1.0.0"
description = "Serviço de recomendação personalizada do ZELO Marketplace"
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  # A matriz de features é montada como uma tupla posicional longa e alinhada a
  # FEATURE_NAMES; quebrar em variáveis intermediárias pioraria a legibilidade.
  "E501",
  # Os comentários são em português e usam tipografia correta (×, −, ⇒). O aviso
  # de "caractere ambíguo" existe para pegar homoglifos em código, não prosa.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os testes importam helpers de `tests.conftest`; sem isso o `pytest` só coloca
# `tests/` no sys.path e a importação quebra quando ele é chamado direto (CI).
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
