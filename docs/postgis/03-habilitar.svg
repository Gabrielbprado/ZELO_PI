<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Habilitar PostGIS no banco</title>
  <desc id="desc">No Query Tool do pgAdmin, crie a extensão PostGIS e confirme que a consulta retorna uma versão.</desc>
  <rect width="900" height="340" rx="24" fill="#f4f6f8"/>
  <text x="40" y="52" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17212b">3. Habilite e valide no banco do projeto</text>
  <rect x="40" y="78" width="820" height="220" rx="14" fill="#17212b"/>
  <rect x="40" y="78" width="820" height="42" rx="14" fill="#263747"/>
  <circle cx="66" cy="99" r="6" fill="#55b878"/>
  <text x="88" y="105" font-family="Arial,sans-serif" font-size="15" fill="#d9e2ea">pgAdmin · Query Tool · zero_marketplace</text>
  <text x="72" y="163" font-family="monospace" font-size="18" fill="#91c8ff">CREATE EXTENSION IF NOT EXISTS postgis;</text>
  <text x="72" y="199" font-family="monospace" font-size="18" fill="#91c8ff">SELECT PostGIS_Version();</text>
  <rect x="72" y="222" width="305" height="38" rx="8" fill="#dff5e6"/>
  <text x="90" y="247" font-family="monospace" font-size="15" font-weight="700" fill="#17643a">3.x.x · PostGIS habilitado</text>
  <text x="410" y="247" font-family="Arial,sans-serif" font-size="15" fill="#c1ccd5">Repita no banco de testes se necessário.</text>
</svg>
